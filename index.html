
<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sulismc</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101522;color:#f4f6ff;font-family:Arial,sans-serif}
main{max-width:1000px;margin:auto;padding:20px}
h1{color:#78aaff}
.panel{background:#1c2435;padding:16px;border-radius:12px;margin:16px 0}
input,button{padding:11px;border:0;border-radius:7px;font-size:15px}
input{background:#303b50;color:white;min-width:0;flex:1}
button{background:#3978ed;color:white;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;margin:8px 0}
#messages{height:250px;overflow:auto}
.msg{padding:9px;background:#111827;border-radius:7px;margin:7px 0;overflow-wrap:anywhere}
.notice{color:#a7b5ca;font-size:13px;margin:7px 0}
#videos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
video{width:100%;background:#080b12;border-radius:10px;max-height:300px}
.small{color:#b4bfd2;font-size:13px}
@media(max-width:500px){.row{flex-wrap:wrap}.row input{flex-basis:100%}}
</style>
</head>
<body>
<main>
<h1>Sulismc</h1>
<p class="small">Közösségi chat és hívás</p>

<section class="panel">
<h3>Belépés</h3>
<div class="row">
<input id="name" maxlength="24" placeholder="Felhasználónév">
<button id="join">Csatlakozás</button>
</div>
<p id="status" class="small">Kapcsolódás...</p>
</section>

<section class="panel">
<h3>Közös chat</h3>
<div id="messages"></div>
<form id="form" class="row">
<input id="text" maxlength="1000" placeholder="Írj üzenetet..." disabled>
<button id="send" disabled>Küldés</button>
</form>
</section>

<section class="panel">
<h3>Hang- és videóhívás</h3>
<p class="small">A híváshoz engedélyezd a mikrofont és szükség esetén a kamerát.</p>
<div class="row">
<button id="call" disabled>Hívás indítása</button>
<button id="camera" disabled>Kamera be/ki</button>
<button id="share" disabled>Képernyő megosztása</button>
<button id="leave" disabled>Hívás befejezése</button>
</div>
<p id="callStatus" class="small">Nem vagy hívásban.</p>
<div id="videos"></div>
</section>
</main>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

const $ = id => document.getElementById(id);
const messages = $("messages");
const videos = $("videos");
const peers = new Map();

let joined = false;
let inCall = false;
let localStream = null;
let screenStream = null;
let cameraEnabled = true;

const rtcConfig = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" }
  ]
};

function notice(text) {
  const div = document.createElement("div");
  div.className = "notice";
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function addMessage(data) {
  const div = document.createElement("div");
  div.className = "msg";
  div.textContent =
    (data.time ? data.time + " — " : "") +
    data.name + ": " + data.text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

socket.on("connect", () => $("status").textContent = "Kapcsolódva.");
socket.on("connect_error", () => $("status").textContent = "Kapcsolódási hiba.");
socket.on("disconnect", () => $("status").textContent = "A kapcsolat megszakadt.");
socket.on("notice", notice);
socket.on("message", addMessage);

$("join").onclick = () => {
  const name = $("name").value.trim();
  if (!name) {
    $("status").textContent = "Írj be egy felhasználónevet!";
    return;
  }

  socket.emit("join", name);
  joined = true;
  $("name").disabled = true;
  $("join").disabled = true;
  $("text").disabled = false;
  $("send").disabled = false;
  $("call").disabled = false;
  $("status").textContent = "Belépve: " + name;
};

$("form").onsubmit = event => {
  event.preventDefault();
  const text = $("text").value.trim();
  if (!joined || !text) return;
  socket.emit("message", text);
  $("text").value = "";
};

function addVideo(id, stream, muted = false) {
  let video = document.getElementById("video-" + id);
  if (!video) {
    video = document.createElement("video");
    video.id = "video-" + id;
    video.autoplay = true;
    video.playsInline = true;
    video.muted = muted;
    video.title = id === "local" ? "Te" : "Másik résztvevő";
    videos.appendChild(video);
  }
  video.srcObject = stream;
}

function removePeer(id) {
  const pc = peers.get(id);
  if (pc) pc.close();
  peers.delete(id);
  document.getElementById("video-" + id)?.remove();
}

function createPeer(id) {
  if (peers.has(id)) return peers.get(id);

  const pc = new RTCPeerConnection(rtcConfig);
  peers.set(id, pc);

  localStream.getTracks().forEach(track => {
    pc.addTrack(track, localStream);
  });

  pc.onicecandidate = event => {
    if (event.candidate) {
      socket.emit("call:signal", {
        to: id,
        data: { candidate: event.candidate }
      });
    }
  };

  pc.ontrack = event => {
    const stream = event.streams[0];
    if (stream) addVideo(id, stream);
  };

  pc.onconnectionstatechange = () => {
    if (["failed", "closed"].includes(pc.connectionState)) {
      removePeer(id);
    }
  };

  return pc;
}

async function sendOffer(id) {
  const pc = createPeer(id);
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  socket.emit("call:signal", {
    to: id,
    data: { description: pc.localDescription }
  });
}

socket.on("call:peers", async ids => {
  for (const id of ids) {
    try {
      await sendOffer(id);
    } catch (error) {
      console.error(error);
    }
  }
});

socket.on("call:peer-joined", async peer => {
  notice(peer.name + " belépett a hívásba.");
  // Az új résztvevő ajánlatát ő maga küldi el a már bent lévőknek.
});

socket.on("call:signal", async ({ from, data }) => {
  try {
    let pc = peers.get(from);

    if (data.description) {
      if (!pc) pc = createPeer(from);
      await pc.setRemoteDescription(data.description);

      if (data.description.type === "offer") {
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        socket.emit("call:signal", {
          to: from,
          data: { description: pc.localDescription }
        });
      }
    }

    if (data.candidate && pc) {
      await pc.addIceCandidate(data.candidate);
    }
  } catch (error) {
    console.error("Hívási hiba:", error);
    $("callStatus").textContent = "Hívási hiba. Próbáld újra.";
  }
});

socket.on("call:peer-left", ({ id }) => {
  removePeer(id);
  notice("Egy résztvevő kilépett a hívásból.");
});

$("call").onclick = async () => {
  if (!joined || inCall) return;

  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: true
    });

    inCall = true;
    addVideo("local", localStream, true);
    $("callStatus").textContent = "Hívásban vagy.";
    $("call").disabled = true;
    $("camera").disabled = false;
    $("share").disabled = false;
    $("leave").disabled = false;

    socket.emit("call:join");
  } catch (error) {
    $("callStatus").textContent =
      "Nem sikerült elérni a kamerát vagy mikrofont. Ellenőrizd a böngésző engedélyeit.";
  }
};

$("camera").onclick = () => {
  if (!localStream) return;

  cameraEnabled = !cameraEnabled;
  localStream.getVideoTracks().forEach(track => {
    track.enabled = cameraEnabled;
  });

  $("camera").textContent = cameraEnabled ? "Kamera be/ki" : "Kamera kikapcsolva";
};

$("share").onclick = async () => {
  if (!inCall || screenStream) return;

  try {
    screenStream = await navigator.mediaDevices.getDisplayMedia({
      video: true,
      audio: false
    });

    const screenTrack = screenStream.getVideoTracks()[0];

    for (const pc of peers.values()) {
      const sender = pc.getSenders().find(s => s.track?.kind === "video");
      if (sender) await sender.replaceTrack(screenTrack);
    }

    screenTrack.onended = stopSharing;
    $("callStatus").textContent = "A képernyődet megosztod.";
  } catch (error) {
    $("callStatus").textContent = "A képernyőmegosztást megszakítottad vagy nem engedélyezted.";
  }
};

async function stopSharing() {
  if (!screenStream) return;

  const oldScreen = screenStream;
  screenStream = null;
  oldScreen.getTracks().forEach(track => track.stop());

  const cameraTrack = localStream?.getVideoTracks()[0];
  for (const pc of peers.values()) {
    const sender = pc.getSenders().find(s => s.track?.kind === "video");
    if (sender && cameraTrack) await sender.replaceTrack(cameraTrack);
  }

  $("callStatus").textContent = "A képernyőmegosztás véget ért.";
}

$("leave").onclick = async () => {
  if (screenStream) await stopSharing();

  socket.emit("call:leave");
  for (const id of [...peers.keys()]) removePeer(id);

  if (localStream) {
    localStream.getTracks().forEach(track => track.stop());
  }

  localStream = null;
  inCall = false;
  $("video-local")?.remove();
  $("call").disabled = false;
  $("camera").disabled = true;
  $("share").disabled = true;
  $("leave").disabled = true;
  $("callStatus").textContent = "Kiléptél a hívásból.";
};
</script>
</body>
</html>
